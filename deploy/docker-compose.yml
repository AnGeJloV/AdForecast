name: adforecast

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: adforecast
      POSTGRES_USER: ${POSTGRES_USER:-adforecast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adforecast} -d adforecast"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ../backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/adforecast
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-adforecast}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ML_SERVICE_BASE_URL: http://ml-service:8000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ml-service:
    build: ../ml-service
    volumes:
      - ml_models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ../frontend
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  ml_models:
