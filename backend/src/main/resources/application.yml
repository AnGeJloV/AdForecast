spring:
  application:
    name: adforecast-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/adforecast}
    username: ${SPRING_DATASOURCE_USERNAME:adforecast}
    password: ${SPRING_DATASOURCE_PASSWORD:adforecast}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

ml-service:
  base-url: ${ML_SERVICE_BASE_URL:http://localhost:8000}

adforecast:
  jwt:
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:8h}
  backups-dir: ${BACKUPS_DIR:../db/backup}
